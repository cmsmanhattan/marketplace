#
# Payment channel configuration.
#
# Every value here can be overridden by a JVM system property or an
# environment variable of the same name with dots replaced by underscores,
# e.g.  -Dstripe.secret_key=sk_live_...   or   STRIPE_SECRET_KEY=sk_live_...
# Keep real keys OUT of this file in production; use the environment.
#

###### Channel selection #########

# Primary channel for new top-ups: stripe | legacy
payment.primary = stripe

# Fall back to the legacy bank gateway (Pay.jsp form) when Stripe is
# disabled, misconfigured, the currency is not supported by Stripe, or a
# Checkout Session cannot be created.
payment.fallback_to_legacy = true

# After this many consecutive Stripe failures the router sends everyone to
# the legacy channel for payment.circuit_open_seconds before trying Stripe
# again. This keeps a Stripe outage from adding a timeout to every checkout.
payment.circuit_failures = 3
payment.circuit_open_seconds = 120

###### Stripe #########

stripe.enabled = true

# Secret key (sk_test_... / sk_live_...). Required.
stripe.secret_key =

# Webhook signing secret (whsec_...). Required for /stripe/webhook.
stripe.webhook_secret =

# Publishable key is not needed for Checkout redirect, kept for templates.
stripe.publishable_key =

# HTTP timeouts, milliseconds.
stripe.connect_timeout_ms = 5000
stripe.request_timeout_ms = 15000

# Maximum age of a webhook signature, seconds (Stripe recommends 300).
stripe.webhook_tolerance_seconds = 300

# Public base URL of this site as seen by the customer's browser and by
# Stripe, WITHOUT trailing slash. If empty, it is built from the request.
# Set it explicitly behind a reverse proxy.
stripe.public_base_url =

# Currencies Stripe may be used for (ISO 4217, comma separated, case
# insensitive). Anything else goes to the legacy channel. Crypto codes in
# the currency table (BTC, LTC, ETH...) are never sent to Stripe.
stripe.currencies = USD,EUR,GBP,CAD,JPY,CNY,TRY,MXN,BRL,INR,RUB
